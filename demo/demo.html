<!doctype html>
<html lang="zh" class="dark">
<head>
<meta charset="utf-8">
<title>ZCode</title>
<link rel="stylesheet" href="../inject/neon.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
         background: #0d0c14; color: #d6d9e0;
         font-family: -apple-system, "PingFang SC", sans-serif; overflow: hidden; }
  .bg-header { height: 46px; display: flex; align-items: center; padding: 0 16px;
               border-bottom: 1px solid rgb(255 255 255 / 0.06); flex: none; }
  .bg-header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .04em; }
  .layout { flex: 1; display: flex; min-height: 0; }
  .bg-sidebar { width: 220px; flex: none; border-right: 1px solid rgb(255 255 255 / 0.06);
                padding: 12px 10px; display: flex; flex-direction: column; gap: 4px; }
  .sess { padding: 8px 12px; border-radius: 8px; font-size: 12.5px; color: #9aa0b0;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess.on { background: rgb(96 165 250 / 0.12); color: #cfe2ff; }
  main.chat { flex: 1; overflow-y: auto; padding: 22px 26px; display: flex;
              flex-direction: column; gap: 14px; }
  .msg { border-radius: 12px; padding: 13px 16px; font-size: 13.5px; line-height: 1.75;
         max-width: 860px; }
  .msg.user { align-self: flex-end; background: rgb(96 165 250 / 0.10); }
  .msg.ai { align-self: flex-start; width: 100%; }
  .msg .who { font-size: 11px; color: #7b8194; margin-bottom: 6px; letter-spacing: .05em; }
  pre.code { background: rgb(0 0 0 / 0.35); border: 1px solid rgb(255 255 255 / 0.07);
             border-radius: 9px; padding: 12px 14px; overflow-x: auto; margin: 10px 0 0;
             font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; line-height: 1.6;
             color: #b8c4e8; white-space: pre; }
  .composer { flex: none; display: flex; gap: 10px; padding: 14px 18px 18px; align-items: flex-end; }
  .composer textarea { flex: 1; height: 58px; resize: none; border-radius: 11px;
                       border: 1px solid rgb(255 255 255 / 0.1); background: rgb(255 255 255 / 0.04);
                       color: #d6d9e0; padding: 12px 14px; font-size: 13px; outline: none;
                       font-family: inherit; }
  .bg-primary { border: none; border-radius: 11px; padding: 0 22px; height: 40px;
                font-size: 13px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <div class="bg-header"><h1>ZCode — tobyatgithub/second-brain</h1></div>
  <div class="layout">
    <aside class="bg-sidebar">
      <div class="sess on">tps-meter 流式速率计实现</div>
      <div class="sess">asar 原子换包安装器</div>
      <div class="sess">neon.css 选择器瘦身</div>
      <div class="sess">hook schema 排查</div>
    </aside>
    <main class="chat" id="chat">
      <div class="msg user">
        <div class="who">You</div>
        给 TPS 徽章加一个滑动窗口速率计算，要求防抖、分母封顶，别让长回合稀释读数
      </div>
      <div class="msg ai">
        <div class="who">ZCode · GLM-5.3</div>
        <div>好的，用 4s 滑动窗口做瞬时速率，分母取「实际窗口覆盖时长」并封顶，这样回合初期读数线性爬升、稳态不被稀释：</div>
        <pre class="code" id="stream"></pre>
      </div>
    </main>
  </div>
  <div class="composer">
    <textarea placeholder="继续输入，Shift+Enter 换行"></textarea>
    <button class="bg-primary">发送</button>
  </div>

  <script src="../inject/tps.js"></script>
  <script>
  // 假流式引擎：三阶段 —— 垫量(80 tok/s × 25s) → 休息(11s, 触发 💤 与冷却期) → 正常输出(50 tok/s)
  (function () {
    var zh = '滑动窗口每毫秒收集一次净增量样本，查询速率时只累加窗口内的样本，分母使用实际覆盖时长并封顶到窗口宽度，这样长回合不会稀释读数，回合初期则线性爬升，读数平滑且无跳变。';
    var codeArr = [
      'function rate(t) {\n',
      '  const cutoff = t - WINDOW, sum = 0;\n',
      '  for (const s of samples) if (s.t >= cutoff) sum += s.tok;\n',
      '  const span = Math.min(WINDOW, Math.max(800, t - turn.start));\n',
      '  return sum / (span / 1000);\n',
      '}\n\n',
      '// 分母封顶：长回合不被稀释\n',
      'samples = samples.filter(s => s.t > cutoff - 2000);\n\n',
      'if (net > BATCH_MAX || net < -BATCH_MAX) return;\n\n',
      'turn.peak = Math.max(turn.peak, r);\n\n'
    ];
    var resumeChunk = '冷却期结束后恢复正常输出，这一批刻意放大到六十 token 以上，目的是越过冷却闸门的 fifty tok 门槛，随后恢复常规速率继续流式输出，徽章应当重新点亮为闪电状态。';
    var el = document.getElementById('stream');
    var start = Date.now(), resumed = false, pi = 0, zp = 0;
    function pump() {
      var t = (Date.now() - start) / 1000;
      var chunk = '';
      if (t < 25) {                                   // 垫量：顺序切片，80 tok/s
        chunk = zh.slice(zp, zp + 12); zp = (zp + 12) % zh.length;
      } else if (t < 36) {
        // 休息
      } else if (!resumed) {
        resumed = true;
        chunk = resumeChunk;                          // ≥50 tok，破冷却闸门
      } else {
        chunk = codeArr[pi++ % codeArr.length];       // 数组取段，每批 10~20 tok
      }
      if (chunk) {
        el.textContent += chunk;
        el.parentNode.parentNode.scrollIntoView(false);
      }
      setTimeout(pump, t < 25 ? 150 : 100);
    }
    pump();
  })();
  </script>
</body>
</html>
