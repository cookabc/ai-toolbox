name: macOS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      # isolated deinit requires Swift 6.2+; macos-15 defaults to Xcode 16.4.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate scripts
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Validate app information
        run: plutil -lint Info.plist
      - name: Test
        run: swift test
      - name: Report test crashes
        if: failure()
        run: |
          for report in "$HOME"/Library/Logs/DiagnosticReports/*; do
            case "$report" in
              *AIToolbox*|*xctest*)
                if [[ -f "$report" ]]; then cat "$report"; fi
                ;;
            esac
          done
          xcrun lldb --batch -o run -o 'thread backtrace all' -- \
            "$(xcrun --find xctest)" \
            -XCTest AIToolboxTests.PanelLayoutTests/testPanelHeightTracksContent \
            "$(swift build --show-bin-path)/AIToolboxPackageTests.xctest"
      - name: Package local app
        run: bash scripts/package-app.sh
